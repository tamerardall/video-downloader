<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video İndirici</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Video İndirici</h1>
  <p class="sub">Reklamsız, takipsiz. Linki yapıştır, indir.</p>
  <form id="f">
    <input id="url" type="url" required placeholder="https://www.tiktok.com/@kullanici/video/..." autocomplete="off">
    <button id="go" type="submit">İndir</button>
  </form>
  <p id="msg" role="status"></p>
</main>
<script src="app.js"></script>
</body>
</html>
