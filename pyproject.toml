[project]
name = "video-downloader"
version = "1.0.0"
description = "Self-hosted, ad-free video downloader for social media"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "yt-dlp[default]",
    # JS runtime YouTube needs, and an ffmpeg binary: no system installs required
    "deno",
    "imageio-ffmpeg>=0.5",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false
